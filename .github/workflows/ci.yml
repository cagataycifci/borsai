name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check app
      - name: Pytest
        env:
          BORSA_AUTO_SEED: "false"
          BORSA_SCHEDULER_ENABLED: "false"
        run: python -m pytest -q

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck -w apps/desktop
      - name: Build
        run: npm run build -w apps/desktop
