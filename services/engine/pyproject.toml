[project]
name = "borsa-engine"
version = "0.1.0"
description = "Borsa AI Terminal — Python engine (data, news, AI, quant, scheduler)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "cryptography>=43.0",
    "keyring>=25.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "google-generativeai>=0.8.3",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
